    // --- CONFIGURAÇÕES E TEMAS ---

      dark: { bg: "#12151A", bgGradFrom: "#1B2029", bgGradTo: "#171B22", panel: "#1B2029", panelAlt: "rgba(255,255,255,0.04)", border: "rgba(255,255,255,0.08)", borderStrong: "rgba(255,255,255,0.16)", text: "#EDE9E2", textDim: "#8B93A1", inputBg: "rgba(255,255,255,0.05)", accent: "#4FB286", accentOn: "#0E1512", warn: "#E0A458", danger: "#D96C5F", fixed: "#8A63D2", shadow: "0 8px 30px rgba(0,0,0,0.35)", },

    const SUBCAT_COLORS = { Alimentação: "#E0A458", Transporte: "#C7A78F", Moradia: "#8FA6C7", Assinaturas: "#A78FC7", Saúde: "#4FB286", Lazer: "#D96C5F", Educação: "#8A63D2", Outros: "#9AA3AE" };

    // ==========================================
    // TELA DE LOGIN / REGISTRO
    // ==========================================
    function AuthScreen({ t }) {
      const [isLogin, setIsLogin] = useState(true);
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError("");
        try {
          if (isLogin) {
            await window.fbAPI.signInWithEmailAndPassword(window.fbAPI.auth, email, password);
          } else {
            await window.fbAPI.createUserWithEmailAndPassword(window.fbAPI.auth, email, password);
          }
        } catch (err) {
          setError(err.message.includes('invalid-credential') ? "E-mail ou senha incorretos." : "Erro na autenticação. Verifique os dados.");
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center px-6" style={{ backgroundColor: t.bg, color: t.text }}>
          <div className="w-full max-w-md p-8 rounded-3xl" style={{ backgroundColor: t.panel, border: `1px solid ${t.borderStrong}`, boxShadow: t.shadow }}>
            <div className="flex items-center justify-center mb-6">
              <div className="w-12 h-12 rounded-xl flex items-center justify-center mr-3" style={{ backgroundColor: t.accent + "22", border: `1px solid ${t.accent}55` }}>
                <IconWallet size={24} style={{ color: t.accent }} strokeWidth={2} />
              </div>
              <h1 className="font-display text-3xl font-semibold tracking-tight">Cofre</h1>
            </div>
            <p className="text-center text-sm mb-8" style={{ color: t.textDim }}>Sincronize suas finanças na nuvem com segurança.</p>

            {error && <div className="p-3 rounded-lg mb-4 text-xs font-medium text-center" style={{ backgroundColor: t.danger + "22", color: t.danger }}>{error}</div>}

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-medium mb-1.5 ml-1" style={{ color: t.textDim }}>E-mail</label>
                <input type="email" required value={email} onChange={e => setEmail(e.target.value)} className="w-full px-4 py-3 rounded-xl text-sm outline-none transition-colors" style={{ backgroundColor: t.inputBg, border: `1px solid ${t.border}`, color: t.text }} placeholder="seu@email.com" />
              </div>
              <div>
                <label className="block text-xs font-medium mb-1.5 ml-1" style={{ color: t.textDim }}>Senha</label>
                <input type="password" required minLength={6} value={password} onChange={e => setPassword(e.target.value)} className="w-full px-4 py-3 rounded-xl text-sm outline-none transition-colors" style={{ backgroundColor: t.inputBg, border: `1px solid ${t.border}`, color: t.text }} placeholder="••••••" />
              </div>
              
              <button type="submit" disabled={loading} className="w-full py-3.5 rounded-xl font-medium text-sm mt-2 transition-transform active:scale-95 flex justify-center" style={{ backgroundColor: t.accent, color: t.accentOn }}>
                {loading ? <div className="w-5 h-5 rounded-full border-2 border-white/30 border-t-white animate-spin"></div> : (isLogin ? "Entrar no Cofre" : "Criar Conta Gratuita")}
              </button>
            </form>

            <div className="mt-6 text-center">
              <button onClick={() => { setIsLogin(!isLogin); setError(""); }} className="text-xs font-medium hover:underline" style={{ color: t.accent }}>
                {isLogin ? "Primeira vez? Crie sua conta" : "Já tem conta? Faça login"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // TELA DE ONBOARDING (PRIMEIRO ACESSO)
    // ==========================================
    function OnboardingScreen({ t, user, onComplete }) {
      const [name, setName] = useState("");
      const [hasCreditCard, setHasCreditCard] = useState(null);
      const [loading, setLoading] = useState(false);

      const handleSave = async () => {
        if (!name.trim() || hasCreditCard === null) return;
        setLoading(true);
        try {
          const db = window.fbAPI.db;
          const appId = window.fbAPI.appId;
          const profileRef = window.fbAPI.doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'data');
          
          const profileData = {
            name: name.trim(),
            hasCreditCard: hasCreditCard,
            showCardsTab: hasCreditCard, // Se usa cartão, ativa a aba de cartões por padrão
            createdAt: new Date().toISOString()
          };
          
          await window.fbAPI.setDoc(profileRef, profileData);
          onComplete(profileData);
        } catch (error) {
          console.error("Erro ao salvar perfil:", error);
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center px-6" style={{ backgroundColor: t.bg, color: t.text }}>
          <div className="w-full max-w-md p-8 rounded-3xl animate-slide-up" style={{ backgroundColor: t.panel, border: `1px solid ${t.borderStrong}`, boxShadow: t.shadow }}>
            <h1 className="font-display text-2xl font-semibold mb-2">Bem-vindo ao Cofre! 🎉</h1>
            <p className="text-sm mb-6" style={{ color: t.textDim }}>Vamos configurar sua conta rapidinho.</p>

            <div className="space-y-6">
              <div>
                <label className="block text-xs font-medium mb-1.5 ml-1" style={{ color: t.textDim }}>Como podemos chamar você?</label>
                <input type="text" value={name} onChange={e => setName(e.target.value)} className="w-full px-4 py-3 rounded-xl text-sm outline-none" style={{ backgroundColor: t.inputBg, border: `1px solid ${t.border}`, color: t.text }} placeholder="Seu nome ou apelido" autoFocus />
              </div>

              <div>
                <label className="block text-xs font-medium mb-2 ml-1" style={{ color: t.textDim }}>Você utiliza cartão de crédito no dia a dia?</label>
                <div className="flex gap-3">
                  <button onClick={() => setHasCreditCard(true)} className="flex-1 py-3 rounded-xl border text-sm font-medium transition-colors" style={{ backgroundColor: hasCreditCard === true ? t.accent + '22' : t.panelAlt, borderColor: hasCreditCard === true ? t.accent : t.border, color: hasCreditCard === true ? t.accent : t.text }}>Sim</button>
                  <button onClick={() => setHasCreditCard(false)} className="flex-1 py-3 rounded-xl border text-sm font-medium transition-colors" style={{ backgroundColor: hasCreditCard === false ? t.accent + '22' : t.panelAlt, borderColor: hasCreditCard === false ? t.accent : t.border, color: hasCreditCard === false ? t.accent : t.text }}>Não</button>
                </div>
              </div>

              <button onClick={handleSave} disabled={!name.trim() || hasCreditCard === null || loading} className="w-full py-3.5 rounded-xl font-medium text-sm mt-4 transition-transform active:scale-95 flex justify-center disabled:opacity-50" style={{ backgroundColor: t.accent, color: t.accentOn }}>
                {loading ? "Salvando..." : "Começar a usar"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // APLICATIVO PRINCIPAL
    // ==========================================
    function MainApp({ user, profile, setProfile, themeProps }) {
      const { mode, setMode, t } = themeProps;
      const [tab, setTab] = useState("dashboard");
      const [transactions, setTransactions] = useState([]);
      const [currentMonth, setCurrentMonth] = useState(new Date().getMonth() + 1 < 10 ? `0${new Date().getMonth() + 1}` : `${new Date().getMonth() + 1}`);
      const [currentYear, setCurrentYear] = useState(new Date().getFullYear().toString());

      const [showTxForm, setShowTxForm] = useState(false);
      const [isSyncing, setIsSyncing] = useState(true);
      const [toast, setToast] = useState(null);

      const db = window.fbAPI.db;
      const appId = window.fbAPI.appId;
      const txCollection = window.fbAPI.collection(db, 'artifacts', appId, 'users', user.uid, 'transactions');

      useEffect(() => {
        if (!user) return;
        setIsSyncing(true);
        const unsubscribe = window.fbAPI.onSnapshot(txCollection, 
          (snapshot) => {
            const docs = [];
            snapshot.forEach((doc) => docs.push({ id: doc.id, ...doc.data() }));
            setTransactions(docs);
            setIsSyncing(false);
          },
          (error) => {
            console.error("Erro no Firestore:", error);
            setToast({ type: "error", msg: "Erro de conexão com a nuvem." });
            setIsSyncing(false);
          }
        );
        return () => unsubscribe();
      }, [user]);

      useEffect(() => {
        if (!toast) return;
        const timer = setTimeout(() => setToast(null), 3000);
        return () => clearTimeout(timer);
      }, [toast]);

      const addTransaction = async (tx) => {
        setIsSyncing(true);
        setShowTxForm(false);
        try {
          await window.fbAPI.addDoc(txCollection, { ...tx, createdAt: new Date().toISOString() });
          setToast({ type: "ok", msg: "Lançamento salvo!" });
        } catch (error) {
          setToast({ type: "error", msg: "Erro ao salvar." });
        }
      };

      const addMultipleTransactions = async (txArray) => {
        setIsSyncing(true);
        try {
          for (const tx of txArray) {
            await window.fbAPI.addDoc(txCollection, { ...tx, createdAt: new Date().toISOString() });
          }
          setToast({ type: "ok", msg: "Fatura importada com sucesso!" });
        } catch (error) {
          setToast({ type: "error", msg: "Erro ao importar fatura." });
        } finally {
          setIsSyncing(false);
        }
      };

      const deleteTx = async (id) => {
        setIsSyncing(true);
        try {
          await window.fbAPI.deleteDoc(window.fbAPI.doc(db, 'artifacts', appId, 'users', user.uid, 'transactions', id));
        } catch (error) {
          setToast({ type: "error", msg: "Erro ao remover." });
        }
      };

      const togglePaid = async (id, currentStatus) => {
        try {
          const newStatus = currentStatus === "paid" ? "pending" : "paid";
          await window.fbAPI.updateDoc(window.fbAPI.doc(db, 'artifacts', appId, 'users', user.uid, 'transactions', id), { status: newStatus });
        } catch (error) {
          setToast({ type: "error", msg: "Erro ao atualizar." });
        }
      };

      const handleLogout = () => window.fbAPI.signOut(window.fbAPI.auth);

      const filteredTx = useMemo(() => {
        return transactions.filter(tx => getMonthYear(tx.date) === `${currentYear}-${currentMonth}`);
      }, [transactions, currentMonth, currentYear]);

      const income = filteredTx.filter((tx) => tx.type === "income").reduce((s, tx) => s + tx.amount, 0);
      const expensesFixed = filteredTx.filter((tx) => tx.type === "fixed").reduce((s, tx) => s + Math.abs(tx.amount), 0);
      const expensesOccasional = filteredTx.filter((tx) => tx.type === "occasional").reduce((s, tx) => s + Math.abs(tx.amount), 0);

      const balance = income - totalExpenses;

      return (
        <div className="min-h-screen flex flex-col relative" style={{ color: t.text }}>

            <div className="max-w-md mx-auto px-5 py-4 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 rounded-md flex items-center justify-center" style={{ backgroundColor: t.accent + "22", border: `1px solid ${t.accent}55` }}>
                  <IconWallet />
                </div>
                <div className="flex flex-col">
                  <span className="font-display text-base leading-tight tracking-tight">Olá, {profile.name}</span>
                  <div className="flex items-center gap-1 mt-0.5">
                    {isSyncing ? <IconCloudUpload /> : <IconCloudLightning />}
                    <span className="text-[9px] font-bold uppercase tracking-wider" style={{ color: isSyncing ? t.warn : t.accent }}>
                      {isSyncing ? "Sync..." : "Cloud Ok"}
                    </span>
                  </div>
                </div>
              </div>

              <div className="flex gap-2">
                <button onClick={() => setTab("config")} className="w-8 h-8 rounded-full flex items-center justify-center transition-colors" style={{ backgroundColor: t.panelAlt, border: `1px solid ${t.border}` }} title="Configurações">
                  <IconSettings />
                </button>
                <button onClick={handleLogout} className="w-8 h-8 rounded-full flex items-center justify-center transition-colors" style={{ backgroundColor: t.danger + "22", color: t.danger }} title="Sair">

          <main className="flex-1 max-w-md w-full mx-auto px-5 py-6 pb-28">
            {tab === "dashboard" && <Dashboard t={t} currentMonth={currentMonth} setCurrentMonth={setCurrentMonth} currentYear={currentYear} setCurrentYear={setCurrentYear} balance={balance} income={income} expensesFixed={expensesFixed} expensesOccasional={expensesOccasional} filteredTx={filteredTx} />}
            {tab === "lancamentos" && <Lancamentos t={t} filteredTx={filteredTx} deleteTx={deleteTx} togglePaid={togglePaid} onNewTx={() => setShowTxForm(true)} />}
            {tab === "cartoes" && <Cartoes t={t} onImport={addMultipleTransactions} />}
            {tab === "ia" && <AssistantIA t={t} balance={balance} income={income} expenses={totalExpenses} month={currentMonth} year={currentYear} />}
            {tab === "config" && <SettingsTab t={t} user={user} profile={profile} setProfile={setProfile} mode={mode} setMode={setMode} />}
          </main>

          <nav className="fixed bottom-0 left-0 right-0 z-30 backdrop-blur-xl" style={{ backgroundColor: t.bg + "F2", borderTop: `1px solid ${t.border}`, paddingBottom: "env(safe-area-inset-bottom)" }}>
            <div className="max-w-md mx-auto px-6 py-2 flex items-center justify-between">
              {[
                { id: "dashboard", icon: IconDashboard, label: "Dashboard" },
                { id: "lancamentos", icon: IconList, label: "Lançamentos" },
                { id: "cartoes", icon: IconCreditCard, label: "Cartões", show: profile.showCardsTab !== false },
                { id: "ia", icon: IconBot, label: "Assistente" },
              ].filter(i => i.show !== false).map((item) => {
                const isActive = tab === item.id;
                const Icon = item.icon;
                return (
                  <button key={item.id} onClick={() => setTab(item.id)} className="flex flex-col items-center gap-1 min-w-[50px] transition-colors" style={{ color: isActive ? t.accent : t.textDim }}>

                      <Icon />
                    </div>
                    <span className="text-[10px] font-medium tracking-wide">{item.label}</span>
                  </button>
                );
              })}
            </div>
          </nav>

          {showTxForm && <TxModal t={t} onClose={() => setShowTxForm(false)} onSave={addTransaction} />}

          {toast && (
            <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 px-4 py-3 rounded-full text-sm font-medium flex items-center gap-2 shadow-xl animate-slide-up" style={{ backgroundColor: toast.type === 'error' ? t.danger : t.accent, color: toast.type === 'error' ? '#fff' : t.accentOn }}>
              <IconCheck /> {toast.msg}
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // TELA DE CONFIGURAÇÕES (LIGA/DESLIGA CARTÕES)
    // ==========================================

      const handleToggleCards = async (val) => {

          const profileRef = window.fbAPI.doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'data');

          <div className="p-5 rounded-3xl" style={{ backgroundColor: t.panel, border: `1px solid ${t.border}` }}>

    // ==========================================
    // COMPONENTES DE DASHBOARD, LANÇAMENTOS, ETC
    // ==========================================
    function Dashboard({ t, currentMonth, setCurrentMonth, currentYear, setCurrentYear, balance, income, expensesFixed, expensesOccasional, filteredTx }) {
      const [drillDown, setDrillDown] = useState(null);
      const totalExpenses = expensesFixed + expensesOccasional;

      const subCatData = useMemo(() => {
        if (!drillDown) return [];
        const map = {};
        filteredTx.filter(tx => tx.type === drillDown).forEach(tx => { map[tx.subCat] = (map[tx.subCat] || 0) + Math.abs(tx.amount); });
        return Object.entries(map).sort((a, b) => b[1] - a[1]);
      }, [drillDown, filteredTx]);

      return (
        <div className="space-y-4">
          <div className="flex items-center justify-between p-3 rounded-2xl" style={{ backgroundColor: t.panelAlt, border: `1px solid ${t.border}` }}>
            <span className="text-xs font-medium uppercase tracking-wider flex items-center gap-1.5" style={{ color: t.textDim }}><IconCalendar /> Período</span>
            <div className="flex gap-2">
              <select value={currentMonth} onChange={e => setCurrentMonth(e.target.value)} className="bg-transparent text-sm font-medium outline-none">
                {["01","02","03","04","05","06","07","08","09","10","11","12"].map(m => (
                  <option key={m} value={m} style={{ background: t.bg }}>{new Date(2026, parseInt(m)-1).toLocaleString('pt-BR', {month: 'long'})}</option>
                ))}
              </select>
              <select value={currentYear} onChange={e => setCurrentYear(e.target.value)} className="bg-transparent text-sm font-medium outline-none">
                {["2025", "2026", "2027"].map(y => <option key={y} value={y} style={{ background: t.bg }}>{y}</option>)}
              </select>
            </div>
          </div>

          <section className="rounded-3xl p-6" style={{ background: `linear-gradient(135deg, ${t.bgGradFrom}, ${t.bgGradTo})`, border: `1px solid ${t.border}`, boxShadow: t.shadow }}>
            <p className="text-xs mb-1 font-medium tracking-wide" style={{ color: t.textDim }}>Saldo do Mês</p>
            <h1 className="font-display text-4xl font-mono-num mb-2">{fmtBRL(balance)}</h1>
            <div className="flex gap-4 mt-5 pt-4" style={{ borderTop: `1px solid ${t.border}` }}>
              <div className="flex-1">
                <span className="text-[10px] uppercase tracking-wider flex items-center gap-1 mb-1" style={{ color: t.textDim }}><IconTrendingUp /> Receitas</span>
                <p className="font-mono-num font-medium text-sm">{fmtBRL(income)}</p>
              </div>
              <div className="flex-1">
                <span className="text-[10px] uppercase tracking-wider flex items-center gap-1 mb-1" style={{ color: t.textDim }}><IconTrendingDown /> Despesas</span>
                <p className="font-mono-num font-medium text-sm">{fmtBRL(totalExpenses)}</p>
              </div>
            </div>
          </section>

          <section className="rounded-3xl p-5" style={{ backgroundColor: t.panel, border: `1px solid ${t.border}`, boxShadow: t.shadow }}>
            <div className="flex items-center justify-between mb-4">
              <h2 className="font-display text-lg flex items-center gap-2"><IconPieChart /> {drillDown ? (drillDown === 'fixed' ? 'Despesas Fixas' : 'Despesas Ocasionais') : 'Visão Geral'}</h2>
              {drillDown && <button onClick={() => setDrillDown(null)} className="text-xs flex items-center gap-1 px-2 py-1 rounded-lg" style={{ backgroundColor: t.panelAlt }}><IconChevronLeft /> Voltar</button>}
            </div>
            {!drillDown ? (
              <div className="space-y-4">
                <button onClick={() => setDrillDown('fixed')} className="w-full text-left group">
                  <div className="flex justify-between text-sm mb-1.5">
                    <span className="flex items-center gap-2 font-medium"><span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: t.fixed }}/> Fixas & Parcelas</span>
                    <span className="font-mono-num font-medium">{fmtBRL(expensesFixed)}</span>
                  </div>
                  <div className="h-2.5 rounded-full overflow-hidden" style={{ backgroundColor: t.panelAlt }}>
                    <div className="h-full transition-all" style={{ width: `${totalExpenses ? (expensesFixed / totalExpenses) * 100 : 0}%`, backgroundColor: t.fixed }} />
                  </div>
                </button>
                <button onClick={() => setDrillDown('occasional')} className="w-full text-left group">
                  <div className="flex justify-between text-sm mb-1.5">
                    <span className="flex items-center gap-2 font-medium"><span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: t.warn }}/> Dia a Dia (Ocasionais)</span>
                    <span className="font-mono-num font-medium">{fmtBRL(expensesOccasional)}</span>
                  </div>
                  <div className="h-2.5 rounded-full overflow-hidden" style={{ backgroundColor: t.panelAlt }}>
                    <div className="h-full transition-all" style={{ width: `${totalExpenses ? (expensesOccasional / totalExpenses) * 100 : 0}%`, backgroundColor: t.warn }} />
                  </div>
                </button>
              </div>
            ) : (
              <div className="space-y-3">
                {subCatData.length === 0 && <p className="text-sm opacity-50 text-center py-4">Nenhum gasto registrado aqui.</p>}

                  <div key={sub}>
                    <div className="flex justify-between text-xs mb-1"><span>{sub}</span><span className="font-mono-num">{fmtBRL(val)}</span></div>
                    <div className="h-1.5 rounded-full overflow-hidden" style={{ backgroundColor: t.panelAlt }}>
                      <div className="h-full transition-all" style={{ width: `${(val / (drillDown === 'fixed' ? expensesFixed : expensesOccasional)) * 100}%`, backgroundColor: SUBCAT_COLORS[sub] || t.textFaint }} />
                    </div>
                  </div>
                ))}
              </div>

    function Lancamentos({ t, filteredTx, deleteTx, togglePaid, onNewTx }) {
      const sorted = [...filteredTx].sort((a, b) => new Date(b.date) - new Date(a.date));
      return (
        <div className="space-y-4">
          <button onClick={onNewTx} className="w-full flex items-center justify-center gap-2 py-3.5 rounded-2xl font-medium text-sm transition-all active:scale-95" style={{ backgroundColor: t.accent, color: t.accentOn }}>
            <IconPlus /> Novo Lançamento Manual
          </button>
          <div className="space-y-2.5 mt-2">
            {sorted.length === 0 ? (
              <div className="text-center py-10 opacity-50"><IconList /><p className="text-sm mt-3">Nenhum lançamento neste mês.</p></div>
            ) : (
              sorted.map((tx) => {
                const isInc = tx.type === "income";
                const isFixed = tx.type === "fixed";
                return (
                  <div key={tx.id} className="rounded-2xl p-3 flex items-center gap-3 transition-colors relative overflow-hidden" style={{ backgroundColor: t.panel, border: `1px solid ${t.border}` }}>
                    {!isInc ? (
                      <button onClick={() => togglePaid(tx.id, tx.status)} className="shrink-0 w-6 h-6 rounded-full border-2 flex items-center justify-center z-10" style={{ backgroundColor: tx.status === "paid" ? (isFixed ? t.fixed : t.warn) : "transparent", borderColor: tx.status === "paid" ? (isFixed ? t.fixed : t.warn) : t.borderStrong, color: t.bg }}><IconCheck /></button>
                    ) : (
                      <div className="shrink-0 w-6 h-6 rounded-full flex items-center justify-center z-10" style={{ backgroundColor: t.accent + '22', color: t.accent }}><IconTrendingUp /></div>
                    )}
                    <div className="flex-1 min-w-0 z-10">
                      <div className="flex items-center gap-2">
                        <p className="text-sm font-medium truncate" style={{ textDecoration: tx.status === "paid" && !isInc ? "line-through" : "none", opacity: tx.status === "paid" && !isInc ? 0.6 : 1 }}>{tx.desc}</p>
                        {isFixed && <span className="text-[9px] font-bold px-1.5 py-0.5 rounded-full whitespace-nowrap" style={{ backgroundColor: t.fixed + '22', color: t.fixed }}>{tx.installments ? `${tx.installments.current}/${tx.installments.total}` : 'Fixo'}</span>}
                      </div>
                      <p className="text-[11px] mt-0.5 flex items-center gap-1 opacity-70">
                        <span className="w-1.5 h-1.5 rounded-full" style={{ backgroundColor: isInc ? t.accent : (isFixed ? t.fixed : t.warn) }} />
                        {tx.subCat} • {tx.date.split('-').reverse().join('/')}
                      </p>
                    </div>
                    <div className="flex items-center gap-2 z-10">
                      <span className="font-mono-num text-sm font-medium" style={{ color: isInc ? t.accent : t.text }}>{isInc ? "+" : ""}{fmtBRL(Math.abs(tx.amount))}</span>
                      <button onClick={() => deleteTx(tx.id)} className="p-1.5 rounded-lg active:bg-red-500/10 transition-colors" style={{ color: t.textDim }}><IconTrash /></button>
                    </div>
                  </div>
                );
              })
            )}
          </div>
        </div>
      );
    }

    function Cartoes({ t, onImport }) {
      const [loading, setLoading] = useState(false);
      const [extractedTxs, setExtractedTxs] = useState(null);
      const [errorMsg, setErrorMsg] = useState("");
      const fileInputRef = useRef(null);

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setLoading(true);
        setErrorMsg("");

        const reader = new FileReader();
        reader.onload = async (event) => {
          const base64Data = event.target.result.split(',')[1];
          const geminiApiKey = "AQ.Ab8RN6LW9JYKR7j0dZ6GIzoI7yZ-CqSGYnR6TMy-3-J471eO_A"; 
          
          const prompt = `Analise esta fatura de cartão de crédito e extraia as transações de compras. 
          Retorne EXATAMENTE e APENAS um array JSON neste formato: 
          [{"desc": "ESTABELECIMENTO", "amount": 150.50, "date": "YYYY-MM-DD", "subCat": "Alimentação"}]
          Onde subCat deve ser uma destas: Alimentação, Transporte, Moradia, Assinaturas, Saúde, Lazer, Educação, Outros.`;

          try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiApiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }, { inlineData: { mimeType: "application/pdf", data: base64Data } }] }]
              })
            });
            const data = await response.json();
            const textResponse = data.candidates?.[0]?.content?.parts?.[0]?.text;
            
            if (textResponse) {
              const jsonStr = textResponse.match(/\[.*\]/s)?.[0];
              if (jsonStr) {
                const parsed = JSON.parse(jsonStr);
                const mappedTxs = parsed.map(tx => ({
                  ...tx,
                  id: Date.now() + Math.random(),
                  amount: -Math.abs(tx.amount),
                  type: 'occasional',
                  status: 'paid'
                }));
                setExtractedTxs(mappedTxs);
              } else {
                throw new Error("Não consegui encontrar as transações.");
              }
            }
          } catch (err) {
            setErrorMsg("Erro ao analisar PDF. Verifique sua Chave de API.");
          } finally {
            setLoading(false);
          }
        };
        reader.readAsDataURL(file);
      };

      return (
        <div className="space-y-4">
          <div className="p-6 rounded-3xl" style={{ backgroundColor: t.panel, border: `1px solid ${t.border}` }}>
            <div className="flex items-center gap-3 mb-2">
              <IconCreditCard />
              <h2 className="font-display text-xl font-semibold">Fatura do Cartão</h2>
            </div>
            <p className="text-sm mb-6" style={{ color: t.textDim }}>Envie o PDF da sua fatura para leitura automática por Inteligência Artificial.</p>
            
            {!extractedTxs ? (
              <div className="flex flex-col items-center justify-center p-8 border-2 border-dashed rounded-2xl" style={{ borderColor: t.borderStrong, backgroundColor: t.panelAlt }}>
                <IconFileText />
                <p className="text-sm font-medium mt-3 mb-4 text-center">Faça upload da Fatura em PDF</p>
                <input type="file" accept="application/pdf" className="hidden" ref={fileInputRef} onChange={handleFileUpload} />
                <button onClick={() => fileInputRef.current?.click()} disabled={loading} className="px-6 py-2.5 rounded-full text-sm font-medium flex items-center gap-2" style={{ backgroundColor: t.accent, color: t.accentOn }}>
                  {loading ? <div className="w-4 h-4 rounded-full border-2 border-t-transparent animate-spin"></div> : "Selecionar PDF"}
                </button>
                {errorMsg && <p className="text-xs mt-3 text-red-400">{errorMsg}</p>}
              </div>
            ) : (
              <div className="space-y-4 animate-slide-up">
                <div className="p-3 rounded-xl mb-4" style={{ backgroundColor: t.accent + '22', color: t.accent }}>
                  <p className="text-xs font-medium text-center">{extractedTxs.length} compras identificadas. Revise antes de salvar.</p>
                </div>
                <div className="space-y-2 max-h-[50vh] overflow-y-auto">
                  {extractedTxs.map((item, idx) => (
                    <div key={item.id} className="p-3 rounded-xl border flex flex-col gap-2" style={{ borderColor: t.borderStrong }}>
                      <div className="flex justify-between items-center">
                        <p className="text-sm font-medium truncate pr-2">{item.desc}</p>
                        <span className="font-mono-num text-sm">{fmtBRL(Math.abs(item.amount))}</span>
                      </div>
                      <select value={item.subCat} onChange={e => { const newTxs = [...extractedTxs]; newTxs[idx].subCat = e.target.value; setExtractedTxs(newTxs); }} className="w-full text-xs p-2 rounded-lg outline-none" style={{ backgroundColor: t.inputBg, border: `1px solid ${t.border}` }}>
                        {Object.keys(SUBCAT_COLORS).map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                    </div>
                  ))}
                </div>
                <div className="flex gap-2 pt-2">
                  <button onClick={() => setExtractedTxs(null)} className="flex-1 py-3 rounded-xl font-medium text-sm border" style={{ borderColor: t.border }}>Cancelar</button>
                  <button onClick={() => { onImport(extractedTxs); setExtractedTxs(null); }} className="flex-1 py-3 rounded-xl font-medium text-sm" style={{ backgroundColor: t.accent, color: t.accentOn }}>Salvar Fatura</button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function AssistantIA({ t, balance, income, expenses, month, year }) {
      const [chatHistory, setChatHistory] = useState([{ role: "model", parts: [{ text: "Olá! Sou a IA do seu Cofre. Analiso seus dados mensais. Como posso ajudar?" }] }]);
      const [input, setInput] = useState("");
      const [isTyping, setIsTyping] = useState(false);
      const endRef = useRef(null);

      useEffect(() => { endRef.current?.scrollIntoView({ behavior: "smooth" }); }, [chatHistory, isTyping]);

      const handleSend = async (e) => {
        e.preventDefault();
        if (!input.trim() || isTyping) return;
        const userText = input.trim();
        const newHistory = [...chatHistory, { role: "user", parts: [{ text: userText }] }];
        setChatHistory(newHistory);
        setInput("");
        setIsTyping(true);

        const systemPrompt = `Você é o Assistente de Inteligência Artificial do aplicativo financeiro 'Cofre Cloud'. Mês/Ano: ${month}/${year}, Saldo: ${fmtBRL(balance)}, Receitas: ${fmtBRL(income)}, Despesas: ${fmtBRL(expenses)}. Responda de forma sucinta.`;

        try {
          const payload = { contents: newHistory, systemInstruction: { parts: [{ text: systemPrompt }] } };
          const apiKey = "AQ.Ab8RN6LW9JYKR7j0dZ6GIzoI7yZ-CqSGYnR6TMy-3-J471eO_A"; 
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          const data = await response.json();
          setChatHistory([...newHistory, { role: "model", parts: [{ text: data.candidates?.[0]?.content?.parts?.[0]?.text || "Erro de rede." }] }]);
        } catch (err) {
          setChatHistory([...newHistory, { role: "model", parts: [{ text: "Erro ao conectar com a IA." }] }]);
        } finally {
          setIsTyping(false);
        }
      };

      return (
        <div className="flex flex-col h-[70vh]">
          <div className="flex-1 overflow-y-auto rounded-2xl p-4 space-y-4 mb-4" style={{ backgroundColor: t.panel, border: `1px solid ${t.border}` }}>
            {chatHistory.map((msg, i) => {
              const isUser = msg.role === "user";
              return (
                <div key={i} className={`flex ${isUser ? 'justify-end' : 'justify-start'}`}>
                  <div className="max-w-[85%] p-3.5 rounded-2xl text-sm leading-relaxed" style={{ backgroundColor: isUser ? t.accent : t.panelAlt, color: isUser ? t.accentOn : t.text }}>
                    <span dangerouslySetInnerHTML={{ __html: msg.parts[0].text.replace(/\n/g, '<br/>') }} />
                  </div>
                </div>
              );
            })}
            {isTyping && <div className="flex justify-start"><div className="p-4 rounded-2xl border" style={{ backgroundColor: t.panelAlt }}><span className="w-2 h-2 rounded-full inline-block animate-pulse" style={{ backgroundColor: t.accent }}></span></div></div>}
            <div ref={endRef} />
          </div>
          <form onSubmit={handleSend} className="relative shrink-0">
            <input type="text" value={input} onChange={(e) => setInput(e.target.value)} placeholder="Pergunte algo..." className="w-full p-4 pr-14 rounded-2xl text-sm border outline-none" style={{ backgroundColor: t.panel, borderColor: t.border, color: t.text }} disabled={isTyping} />
            <button type="submit" disabled={isTyping || !input.trim()} className="absolute right-2 top-1/2 -translate-y-1/2 w-10 h-10 flex items-center justify-center rounded-xl" style={{ backgroundColor: t.accent, color: t.accentOn }}><IconSend /></button>
          </form>
        </div>
      );
    }

    function TxModal({ t, onClose, onSave }) {
      const [type, setType] = useState("occasional");
      const [desc, setDesc] = useState("");
      const [amount, setAmount] = useState("");
      const [date, setDate] = useState(todayISO());
      const [subCat, setSubCat] = useState("Outros");
      const [instCurrent, setInstCurrent] = useState("1");
      const [instTotal, setInstTotal] = useState("1");

      const canSave = desc.trim() && amount && Number(amount) > 0;
      const inputStyle = { backgroundColor: t.inputBg, border: `1px solid ${t.border}`, color: t.text };

      const submit = () => {
        if (!canSave) return;
        const finalAmount = type === "income" ? Math.abs(Number(amount)) : -Math.abs(Number(amount));
        const tx = { desc: desc.trim(), amount: finalAmount, date, type, subCat: type === "income" ? "Renda" : subCat, status: type === "income" ? "paid" : "pending" };
        if (type === "fixed" && Number(instTotal) > 1) { tx.installments = { current: Number(instCurrent), total: Number(instTotal) }; }
        onSave(tx);
      };

      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-end justify-center z-50">
          <div className="w-full max-w-md p-6 max-h-[90vh] overflow-y-auto rounded-t-3xl pb-10" style={{ backgroundColor: t.panel, borderTop: `1px solid ${t.borderStrong}`, boxShadow: t.shadow }}>
            <div className="flex items-center justify-between mb-6">
              <h3 className="font-display text-xl">Nova Transação</h3>
              <button onClick={onClose} className="p-2 rounded-full" style={{ backgroundColor: t.panelAlt }}><IconX /></button>
            </div>
            <div className="space-y-4">
              <div className="flex gap-2 p-1 rounded-xl" style={{ backgroundColor: t.panelAlt }}>
                {[{ id: "income", label: "Receita", color: t.accent }, { id: "occasional", label: "Avulsa", color: t.warn }, { id: "fixed", label: "Fixa/Parcela", color: t.fixed }].map((tp) => (
                  <button key={tp.id} onClick={() => setType(tp.id)} className="flex-1 py-2.5 rounded-lg text-xs font-medium" style={{ backgroundColor: type === tp.id ? tp.color : "transparent", color: type === tp.id ? "#fff" : t.textDim }}>{tp.label}</button>
                ))}
              </div>
              <input value={desc} onChange={e => setDesc(e.target.value)} placeholder="Descrição" className="w-full rounded-xl px-4 py-3 text-sm outline-none" style={inputStyle} />
              <div className="grid grid-cols-2 gap-3">
                <input type="number" value={amount} onChange={e => setAmount(e.target.value)} placeholder="Valor (R$)" className="w-full rounded-xl px-4 py-3 text-sm outline-none" style={inputStyle} />
                <input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full rounded-xl px-4 py-3 text-sm outline-none" style={inputStyle} />
              </div>
              {type !== "income" && <select value={subCat} onChange={e => setSubCat(e.target.value)} className="w-full rounded-xl px-4 py-3 text-sm outline-none" style={inputStyle}>{Object.keys(SUBCAT_COLORS).map(c => <option key={c} value={c}>{c}</option>)}</select>}
              <button onClick={submit} disabled={!canSave} className="w-full py-4 rounded-xl font-medium text-sm mt-6" style={{ backgroundColor: type === 'income' ? t.accent : (type === 'fixed' ? t.fixed : t.warn), color: "#fff" }}>Salvar</button>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // CONTROLE DE ESTADO GLOBAL (AUTH + ONBOARDING)
    // ==========================================
    function App() {
      const [mode, setMode] = useState("dark");
      const [user, setUser] = useState(null);
      const [profile, setProfile] = useState(null);
      const t = THEMES[mode];

      useEffect(() => {
        const interval = setInterval(() => {
          if (window.fbAPI) {
            clearInterval(interval);
            window.fbAPI.onAuthStateChanged(window.fbAPI.auth, async (currentUser) => {
              if (currentUser) {
                setUser(currentUser);
                try {
                  const db = window.fbAPI.db;
                  const appId = window.fbAPI.appId;
                  const profileDoc = await window.fbAPI.getDoc(window.fbAPI.doc(db, 'artifacts', appId, 'users', currentUser.uid, 'profile', 'data'));
                  if (profileDoc.exists()) {
                    setProfile(profileDoc.data());
                  } else {
                    setProfile(false);
                  }
                } catch (e) {
                  setProfile(false);
                }
              } else {
                setUser(false);
                setProfile(null);
              }
            });
          }
        }, 100);
      }, []);

      if (user === null || (user && profile === null)) return <div className="min-h-screen flex items-center justify-center"><div className="w-8 h-8 rounded-full border-4 border-t-emerald-500 border-white/10 animate-spin"></div></div>;
      if (user === false) return <AuthScreen t={t} />;
      if (profile === false) return <OnboardingScreen t={t} user={user} onComplete={setProfile} />;
      
      return <MainApp user={user} profile={profile} setProfile={setProfile} themeProps={{ mode, setMode, t }} />;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
